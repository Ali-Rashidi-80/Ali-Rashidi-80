<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient (Light) -->
    <linearGradient id="bgGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Top Neon Accent -->
    <linearGradient id="neonBarLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="80%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glowing Orbs (Light) -->
    <radialGradient id="cyanGlowLight" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlowLight" cx="20%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern (Light) -->
    <pattern id="techGridLight" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#cbd5e1" stroke-width="0.7" stroke-opacity="0.4"/>
      <circle cx="28" cy="28" r="1" fill="#0284c7" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="880" height="200" rx="14" fill="url(#bgGradientLight)"/>
  
  <!-- Subtle Glowing Orbs -->
  <rect width="880" height="200" rx="14" fill="url(#cyanGlowLight)"/>
  <rect width="880" height="200" rx="14" fill="url(#emeraldGlowLight)"/>
  
  <!-- Subtle Technical Grid Overlay -->
  <rect width="880" height="200" rx="14" fill="url(#techGridLight)"/>

  <!-- Card Border -->
  <rect x="0.5" y="0.5" width="879" height="199" rx="13.5" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="880" height="3.5" rx="2" fill="url(#neonBarLight)"/>

  <!-- Status Chip -->
  <g transform="translate(42, 28)">
    <rect width="250" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="12" cy="11" r="4" fill="#059669"/>
    <circle cx="12" cy="11" r="6" fill="#059669" fill-opacity="0.25"/>
    <text x="24" y="14.5" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">ACTIVE SYSTEMS DEVELOPMENT</text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(42, 88)">
    <text fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.6">Ali Rashidi</text>
    <text x="180" y="-1" fill="url(#textGradLight)" font-family="'Fira Code', monospace, Consolas" font-size="14" font-weight="600">/ systems-dev</text>
  </g>

  <!-- Subtitle / Headline -->
  <g transform="translate(42, 118)">
    <text fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">
      Full-Lifecycle Systems &amp; Product Engineer <tspan fill="#94a3b8">|</tspan> Edge AIoT, Scalable Backends &amp; Modern UX
    </text>
  </g>

  <!-- Tech Capsules / Tags -->
  <g transform="translate(42, 146)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="24" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="65" y="16" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">Rust · C/C++ · Zig</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(138, 0)">
      <rect width="148" height="24" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="74" y="16" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">Industrial AIoT · TinyML</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(294, 0)">
      <rect width="144" height="24" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
      <text x="72" y="16" fill="#4f46e5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">Python · FastAPI · SQL</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(446, 0)">
      <rect width="154" height="24" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
      <text x="77" y="16" fill="#7c3aed" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="11" font-weight="600" text-anchor="middle">React · Flutter · Figma UX</text>
    </g>
  </g>

  <!-- Right Decorative Architecture Graphics -->
  <g transform="translate(680, 24)" opacity="0.85">
    <!-- Outer Orbit Ring -->
    <circle cx="95" cy="75" r="68" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="95" cy="75" r="46" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="95" cy="75" r="26" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Central Core Node -->
    <circle cx="95" cy="75" r="9" fill="#0284c7"/>
    <circle cx="95" cy="75" r="14" fill="#0284c7" fill-opacity="0.2"/>

    <!-- Satellite Nodes -->
    <line x1="95" y1="75" x2="140" y2="40" stroke="#059669" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="140" cy="40" r="5" fill="#059669"/>
    <circle cx="140" cy="40" r="9" fill="#059669" fill-opacity="0.2"/>

    <line x1="95" y1="75" x2="48" y2="108" stroke="#4f46e5" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="48" cy="108" r="5" fill="#4f46e5"/>
    <circle cx="48" cy="108" r="9" fill="#4f46e5" fill-opacity="0.2"/>

    <line x1="95" y1="75" x2="135" y2="120" stroke="#059669" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="135" cy="120" r="4.5" fill="#059669"/>
    
    <line x1="95" y1="75" x2="52" y2="42" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="52" cy="42" r="4" fill="#7c3aed"/>

    <circle cx="118" cy="57" r="2" fill="#0284c7"/>
    <circle cx="72" cy="92" r="2" fill="#059669"/>
    <circle cx="115" cy="98" r="1.8" fill="#7c3aed"/>
  </g>
</svg>
